name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      # Secret scan (gitleaks-action gratis untuk repo akun pribadi; organisasi butuh GITLEAKS_LICENSE).
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mulai 11 Nov: bun run e2e (Playwright, satu balapan penuh lawan 3 bot, AI_MODE=mock)
