<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Balap Fakta Lingkungan — game balap multiplayer untuk siswa SMP"
    />
    <title>Balap Fakta Lingkungan</title>
  </head>
  <body>
    <svg
      class="scene"
      viewBox="0 0 1600 900"
      preserveAspectRatio="xMidYMax slice"
      aria-hidden="true"
    >
      <defs>
        <g id="pine">
          <rect x="-8" y="0" width="16" height="40" fill="var(--trunk)" />
          <path d="M-50 10L0-60L50 10Z" fill="var(--t1)" />
          <path d="M-42-26L0-100L42-26Z" fill="var(--t2)" />
          <path d="M-32-62L0-130L32-62Z" fill="var(--t1)" />
        </g>
        <g id="oak">
          <rect x="-9" y="-10" width="18" height="60" fill="var(--trunk)" />
          <circle cx="0" cy="-50" r="46" fill="var(--t2)" />
          <circle cx="-34" cy="-24" r="32" fill="var(--t1)" />
          <circle cx="34" cy="-24" r="32" fill="var(--t1)" />
        </g>
        <g id="cloud">
          <rect x="0" y="20" width="170" height="44" rx="22" fill="var(--cloud)" />
          <circle cx="60" cy="22" r="28" fill="var(--cloud)" />
          <circle cx="105" cy="26" r="22" fill="var(--cloud)" />
        </g>
      </defs>
      <rect width="1600" height="900" fill="var(--sky)" />
      <circle cx="1380" cy="130" r="70" fill="var(--sun)" />
      <use href="#cloud" x="140" y="90" />
      <use href="#cloud" x="640" y="40" transform="translate(0 0) scale(.8)" />
      <use href="#cloud" x="1000" y="170" />
      <path d="M0 560Q260 430 520 520T1040 500T1600 470V900H0Z" fill="var(--h1)" />
      <use href="#pine" transform="translate(120 520) scale(.8)" />
      <use href="#oak" transform="translate(330 505) scale(.8)" />
      <use href="#pine" transform="translate(900 515) scale(.7)" />
      <use href="#oak" transform="translate(1180 490) scale(.8)" />
      <use href="#pine" transform="translate(1480 470) scale(.8)" />
      <path d="M0 660Q320 540 640 630T1260 610T1600 590V900H0Z" fill="var(--h2)" />
      <use href="#oak" transform="translate(70 640)" />
      <use href="#pine" transform="translate(260 630)" />
      <use href="#pine" transform="translate(470 650) scale(.8)" />
      <use href="#oak" transform="translate(1060 630)" />
      <use href="#pine" transform="translate(1300 620)" />
      <use href="#oak" transform="translate(1520 610)" />
      <path d="M0 780Q400 690 800 760T1600 730V900H0Z" fill="var(--h3)" />
      <use href="#pine" transform="translate(40 790) scale(1.2)" />
      <use href="#pine" transform="translate(1560 770) scale(1.2)" />
      <use href="#oak" transform="translate(190 800) scale(1.1)" />
      <use href="#oak" transform="translate(1420 790) scale(1.1)" />
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
